<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Alex+Brush&family=Cormorant+Garamond:ital@0;1&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
body { margin:0; width:1200px; height:630px; overflow:hidden; background:#2E1218; }
.cover { width:1200px; height:630px; position:relative;
  background:
    radial-gradient(105% 88% at 50% -10%, #4A1F2A 0%, rgba(74,31,42,0) 52%),
    radial-gradient(120% 86% at 50% 114%, #5A1C2A 0%, rgba(90,28,42,0) 46%),
    linear-gradient(180deg, #33141C 0%, #2E1218 58%, #3E1820 100%);
  display:flex; flex-direction:column; align-items:center; text-align:center; }
.glow { position:absolute; top:-160px; left:50%; transform:translateX(-50%);
  width:700px; height:700px; border-radius:50%;
  background:radial-gradient(circle, rgba(201,162,75,.18) 0%, rgba(201,162,75,.06) 44%, transparent 68%); }
.medallion { position:absolute; top:-84px; left:50%; transform:translateX(-50%); width:210px; opacity:.6; }
.cross { position:absolute; top:52px; left:50%; transform:translateX(-50%); width:44px; opacity:.9; }
.window { position:absolute; top:452px; left:50%; transform:translateX(-50%);
  width:620px; opacity:.92; filter:drop-shadow(0 -8px 40px rgba(0,0,0,.35)); }
.eyebrow { position:relative; font-family:'Jost',sans-serif; font-weight:300; font-size:15px; letter-spacing:.42em; text-transform:uppercase; color:#D2A447; margin-top:206px; }
.names { position:relative; font-family:'Alex Brush',cursive; font-size:92px; line-height:1; color:#F3E9D8; margin-top:8px; text-shadow:0 2px 30px rgba(210,164,71,.4); }
.date { position:relative; font-family:'Jost',sans-serif; font-weight:300; font-size:17px; letter-spacing:.46em; text-transform:uppercase; color:#C9A24B; margin-top:14px; }
.sub { position:relative; margin-top:8px; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:20px; color:#D8C29A; }
.wordmark { position:absolute; bottom:14px; left:0; right:0; font-family:'Jost',sans-serif;
  font-weight:300; font-size:11px; letter-spacing:.5em; text-transform:uppercase; color:#D8C29A; }
</style></head>
<body><div class="cover">
  <div class="glow"></div>
  <img class="medallion" src="assets/art/rosette-amoris.png" alt="">
  <img class="window" src="assets/art/window-amoris-tall.png" alt="">
  <div class="eyebrow">The Holy Matrimony of</div>
  <div class="names">Elowen &amp; Finnian</div>
  <div class="date">19 · 06 · 2027</div>
  <div class="sub">I have found the one whom my soul loves — Song of Songs 3:4</div>
  <div class="wordmark">Amoris · Invitation Atelier</div>
</div></body></html>
